[project]
name = "effigov-agent"
version = "0.1.0"
description = "EffiGov take-home voice agent (LiveKit Agents)"
requires-python = ">=3.11"
dependencies = [
    "livekit-agents[openai,silero,deepgram,turn-detector]>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
